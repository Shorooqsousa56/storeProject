

<div class="container text-center">
  <div class="row">
    <div class="col">
     
      <div class="container mt-4">
  

  <div *ngIf="cartItems.length === 0" class="alert alert-light">
    Your cart is empty.
  </div>

  <div *ngFor="let item of cartItems" class="card p-3 mb-3">

    <div class="d-flex align-items-center">

      <img 
        [src]="item.picture" 
        alt="{{ item.name }}"
        class="img-thumbnail me-3"
        style="width: 100px; height: 100px; object-fit: cover;"
      />

      <div class="flex-grow-1">
        <h5>{{ item.name }}</h5>
        <p>Price: ${{ item.price }}</p>

        <div class="input-group input-group-sm" style="width: 140px;">
          <button class="btn btn-outline-secondary" (click)="decrease(item)">-</button>
          <input type="text" class="form-control text-center" [value]="item.quantity" readonly>
          <button class="btn btn-outline-secondary" (click)="increase(item)">+</button>
        </div>
      </div>

       <button class="btn btn-danger ms-3" (click)="remove(item.id)">
        Remove
      </button>

    </div>
  </div>

 
</div>

    </div>
    <div *ngIf="cartItems.length > 0"  class="col mt-4">
      
   

  <!-- Full Name -->
  <div class="form-floating mb-3">
    <input 
      type="text" 
      class="form-control" 
      id="fullName" 
      placeholder="Full Name"
      [(ngModel)]="fullName"
       (ngModelChange)="onFullNameChange($event)"
      name="fullName"
    >
    <label for="fullName">Full Name</label>
  </div>

  <!-- Address -->
  <div class="form-floating mb-3">
    <input 
      type="text" 
      class="form-control" 
      id="address" 
      placeholder="Address"
      [(ngModel)]="address"
      (ngModelChange)="onAddressChange($event)"
      name="address"
    >
    <label for="address">Address</label>
  </div>

  <!-- Credit Card -->
  <div class="form-floating mb-3">
    <input 
      type="text" 
      class="form-control" 
      id="creditCard" 
      placeholder="Credit Card"
      [(ngModel)]="creditCard"
      (ngModelChange)="onCreditCardChange($event)"
      name="creditCard"
    >
    <label for="creditCard">Credit Card</label>
  </div>

  <!-- checkout -->
  <div *ngIf="cartItems.length > 0" class="mt-3">
    <h4>Total: ${{ total }}</h4>
    <button class="btn btn-success w-100" (click)="checkout()">Checkout</button>
  </div>
    

    </div>
    
  </div>
</div>
