<div class="container mt-4">

  <!-- Loading -->
  <div *ngIf="loadingProducts" class="text-center my-3">
    Loading products...
  </div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Products Grid -->
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <div class="card h-100">
        <img [src]="product.picture" class="card-img-top" [alt]="product.name" (click)="viewProduct(product)">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ product.name }}</h5>
          <p class="fw-bold">Price: ${{ product.price }}</p>

          <!-- Quantity Selector -->
          <div class="mt-auto d-flex align-items-center justify-content-between">
            <div class="input-group input-group-sm" style="width: 120px;">
              <button class="btn btn-outline-secondary" type="button" (click)="decreaseQuantity(product)">-</button>
              <input type="number" class="form-control text-center" [value]="product.quantity || 1" [max]="product.stock_balance" readonly>
              <button class="btn btn-outline-secondary" type="button" (click)="increaseQuantity(product)">+</button>
            </div>
          </div>

          <!-- Add to Cart -->
          <button class="btn btn-pink mt-2" (click)="addToCart(product)">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>
