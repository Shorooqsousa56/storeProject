<div class="container mt-4">
  <div *ngIf="loadingProducts" class="text-center my-3">Loading products...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let product of products">
      <app-product-item
        [product]="product"
        (addToCartEvent)="handleAddToCart($event)"
        (viewProductEvent)="handleViewProduct($event)">
      </app-product-item>
    </div>
  </div>
</div>
